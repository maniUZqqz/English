{% extends 'base.html' %}

{% block title %}بازیابی رمز عبور — English Lady{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <div class="section-card text-center">
        <div style="font-size: 2.5rem;">🔑</div>
        <h4 class="mt-2 mb-2">بازیابی رمز عبور</h4>
        <p class="text-secondary small">ایمیل حساب خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" class="form-control mb-3 en" placeholder="you@example.com" required>
            <button type="submit" class="btn btn-brand w-100">ارسال لینک بازیابی</button>
        </form>
        <div class="mt-3 small"><a href="{% url 'login' %}">بازگشت به ورود</a></div>
    </div>
</div>
{% endblock %}
