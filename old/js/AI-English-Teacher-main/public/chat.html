<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
<div class="chat-container">
    <header>
        <h1>Chat Bot</h1>
    </header>
    <main class="messages" id="messages"></main>
    <form id="chatForm" autocomplete="off">
        <input type="text" id="userInput" placeholder="Type here..." required aria-label="پیام کاربر" />
        <button type="submit" aria-label="ارسال">ارسال</button>
    </form>
</div>
<div class="background"></div>
<div class="stars">
    <!-- تعداد بیشتری از ستاره‌ها با مکان‌های تصادفی -->
    <!-- می‌توانید از جاوااسکریپت برای ایجاد ستاره‌ها به صورت دینامیک استفاده کنید -->
</div>
<script src="chat.js"></script>
</body>
</html>
