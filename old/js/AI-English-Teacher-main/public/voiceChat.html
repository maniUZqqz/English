<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>Voice Chatbot</title>
  <link rel="stylesheet" href="voiceChat.css">
  <link href="https://fonts.googleapis.com/css2?family=Lahaa&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="voice-chat-container">
  <header>
    <h1>voice chatbot</h1>
    <div class="status-bar">
      <i class="fas fa-microphone status-icon"></i>

      <span id="statusText">Ready for recording</span>
    </div>
  </header>
  <div class="voice-messages" id="voiceMessages"></div>
  <div class="voice-controls">
    <button id="startVoiceButton" title="شروع ضبط"><i class="fas fa-microphone"></i> start</button>
    <button id="stopVoiceButton" title="توقف ضبط" disabled><i class="fas fa-stop"></i> stop</button>
  </div>
</div>

<div class="background"></div>
<div class="stars"></div>

<script src="voiceChat.js"></script>
</body>
</html>
