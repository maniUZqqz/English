<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Grammar Checker AI</title>
    <link rel="stylesheet" href="grammer.css">
</head>
<body>
<div class="chat-container">
    <header>
        <h1>Grammar Checker</h1>
    </header>
    <main id="messages">
    </main>
    <div id="resultBox">
        <div class="result-content" id="resultText"></div>
    </div>
    <form id="grammarForm">
        <div class="input-container">
            <textarea id="inputText" placeholder="Type your text here..." required></textarea>
            <button type="submit">Check Grammar</button>
        </div>
    </form>
</div>

<script src="grammer.js"></script>
</body>
</html>
